<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praline · Examples</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#24332c;background:#fafbf9;font:15px/1.6 Helvetica,Arial,sans-serif}header{padding:24px 32px;border-bottom:1px solid #dce2df;display:flex;align-items:baseline;gap:24px}h1{font-size:25px;letter-spacing:-1px;margin:0}header p{margin:0;color:#64726b;font-size:13px}.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 89px)}aside{overflow:auto;padding:24px 18px;background:#f0f3ef;border-right:1px solid #dce2df}h2{font-size:12px;color:#63716b;margin:0 0 14px;font-weight:600}button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:inherit;font:inherit;padding:12px;margin-bottom:6px;border-radius:4px;cursor:pointer}button:hover{background:#e4eae3}button[aria-pressed=true]{border-color:#bfcec2;background:white}button small{display:block;color:#64726b;font-size:12px}.note{margin:24px 12px;font-size:12px;color:#63716b}.viewer{min-height:0;display:flex;flex-direction:column;min-width:0}.toolbar{padding:12px 24px;border-bottom:1px solid #dce2df;display:flex;justify-content:space-between;font-size:13px;gap:16px}a{color:#28644d}iframe{border:0;width:100%;flex:1;background:#fafbf9}:focus-visible{outline:2px solid #28644d;outline-offset:3px}@media(max-width:750px){header{padding:16px}.layout{grid-template-columns:180px 1fr}aside{padding:16px 8px}header p{font-size:11px}.toolbar{padding:10px}}
</style>
<header><h1>Praline</h1><p>Browse saved compiler reports · recorded local evidence, not live compilation</p></header>
<div class="layout"><aside><h2>EXAMPLES</h2>
<button data-run="map-cpu" aria-pressed="true">Independent helper map<small>CPU generation, validation & timing</small></button>
<button data-run="global_write" aria-pressed="false">Shared helper write<small>A conflicting global write</small></button>
<button data-run="prefix_dependency" aria-pressed="false">Dependent iterations<small>Read-after-write dependency</small></button>
<button data-run="scatter_write" aria-pressed="false">Scattered writes<small>Output indices may collide</small></button>
<button data-run="alias_unknown" aria-pressed="false">Uncertain aliasing<small>Missing independence evidence</small></button>
<button data-run="unknown_call" aria-pressed="false">Unresolved helper<small>Unsupported call effects</small></button>
<button data-run="map-gpu" aria-pressed="false">GPU generation<small>Code generation ≠ device execution</small></button>
<p class="note">Start with the loop decision, inspect the code, then check execution evidence. Timings describe only the recorded workload and environment.</p>
</aside><div class="viewer"><div class="toolbar"><span id="label">Independent helper map</span><a id="open" href="evidence/map-cpu/report.html" target="_blank" rel="noopener">Open report ↗</a></div><iframe id="report" title="Praline compiler report" src="evidence/map-cpu/report.html"></iframe></div></div>
<script>
document.querySelectorAll('button[data-run]').forEach(button=>button.addEventListener('click',()=>{
document.querySelectorAll('button[data-run]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
const path='evidence/'+button.dataset.run+'/report.html';document.querySelector('#report').src=path;document.querySelector('#open').href=path;document.querySelector('#label').textContent=button.childNodes[0].textContent;
}));
</script></html>
